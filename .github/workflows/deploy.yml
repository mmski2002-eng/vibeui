name: deploy

# Сборка уехала с VPS в runner: на сервере одно ядро, 1 ГБ памяти и занятый
# своп, там next build занимал десятки минут. Runner собирает Linux-релиз,
# сервер только распаковывает его и переключает симлинк.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 185.104.251.106
  DEPLOY_USER: root
  REGISTRY_BASE_URL: https://vibeui.ru/r
  NEXT_PUBLIC_SITE_URL: https://vibeui.ru
  # Номера счётчиков и токены подтверждения прав лежат в коде: они публичны,
  # и переменные репозитория здесь только прятали бы настройку от следующего
  # разработчика. Пустая переменная перекрыла бы значение из кода — не задавать.
  # Каталог дорос до ~1770 items: проверка типов в `next build` (и отдельный
  # typecheck) упирается в дефолтный ~2 ГБ heap Node 20 и падает с OOM.
  # Runner ubuntu-latest несёт 16 ГБ — поднимаем потолок кучи.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Потолок на весь job: заливка по узкому каналу до РФ-хостинга должна
    # падать с ошибкой, а не висеть часами, занимая очередь concurrency.
    timeout-minutes: 60
    steps:
      # Вся история: sitemap берёт lastmod из даты последнего коммита файла
      # (scripts/build-lastmod.mjs). Shallow-checkout дал бы всем одну дату.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Та же мажорная версия, что и на сервере: standalone не несёт свой node.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Секрет нужен только чтобы better-auth не ругался при пререндере:
      # на сервере свой из .env, в бандл значение не попадает.
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-prerender-only-not-a-real-secret-0000' }}

      # Только после сборки: LayoutProps и прочие типы маршрутов Next
      # генерирует в .next/types, в чистом checkout их ещё нет.
      - run: npm run typecheck

      # Standalone не копирует статику сам.
      - name: Собрать релиз
        run: |
          mkdir -p release
          cp -a .next/standalone/. release/
          mkdir -p release/.next
          cp -a .next/static release/.next/static
          cp -a public release/public
          # Миграции применяет сервер: базы у runner-а нет, она слушает
          # только localhost.
          mkdir -p release/scripts
          cp -a drizzle release/drizzle
          cp scripts/migrate.sh release/scripts/migrate.sh

      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # Релиз весит 427 МБ, из них public 156 МБ и node_modules 50 МБ не
      # меняются между сборками, а в .next/server (127 МБ) от правки одной
      # страницы меняются единицы файлов. Архивом это ехало целиком: на узком
      # канале до РФ-хостинга (видели 26 КБ/с) — часы, и шаг выглядел
      # зависшим. rsync сверяет содержимое с прошлым релизом (--checksum, а не
      # mtime: у собранных на runner-е файлов он всегда новый), передаёт
      # только отличия, остальное сервер берёт из предыдущего каталога
      # жёсткими ссылками — заодно три релиза на диске занимают как один.
      # --timeout: оборвавшийся канал должен ронять шаг, а не висеть.
      - name: Залить и переключить релиз
        run: |
          REL="/srv/vibeui-releases/$(date -u +%Y%m%d-%H%M%S)"
          PREV=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" 'ls -1dt /srv/vibeui-releases/* 2>/dev/null | head -1')
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$REL'"
          rsync -az --checksum --delete --timeout=600 --info=stats2 \
            ${PREV:+--link-dest="$PREV"} \
            release/ "$DEPLOY_USER@$DEPLOY_HOST:$REL/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "REL='$REL' bash -s" < scripts/deploy-remote.sh

      - name: Проверить живой сайт
        run: |
          # Код 23 у curl на runner — обрыв записи большого тела, хотя ответ уже
          # 200. Код статуса берём из -w и не даём этому обрыву уронить шаг.
          fetch() {
            curl -sS --http1.1 --retry 2 --retry-delay 2 -o "$1" -w '%{http_code}' "$2" || true
          }
          code=$(fetch /tmp/vibeui-components.html https://vibeui.ru/components)
          echo "components $code"
          test "$code" = "200"
          # Страница item'а публичная и рендерится, код установки закрыт:
          # /c/<name> анониму отвечает 401.
          code=$(fetch /tmp/vibeui-item.html https://vibeui.ru/components/button-001)
          echo "button $code"
          test "$code" = "200"
          grep -q button-001 /tmp/vibeui-item.html
          code=$(fetch /tmp/vibeui-c.html https://vibeui.ru/c/button-001)
          echo "registry $code"
          test "$code" = "401"
          code=$(fetch /tmp/vibeui-start.html https://vibeui.ru/start)
          echo "start $code"
          test "$code" = "200"
          grep -q 'id="paste"' /tmp/vibeui-start.html
          code=$(fetch /tmp/vibeui-en.html https://vibeui.ru/en/start)
          echo "en $code"
          test "$code" = "404"
          code=$(fetch /tmp/vibeui-robots.txt https://vibeui.ru/robots.txt)
          echo "robots $code"
          test "$code" = "200"
          grep -q "Sitemap: https://vibeui.ru/sitemap.xml" /tmp/vibeui-robots.txt
          code=$(fetch /tmp/vibeui-sitemap.xml https://vibeui.ru/sitemap.xml)
          echo "sitemap $code"
          test "$code" = "200"
          grep -q "<loc>https://vibeui.ru/components</loc>" /tmp/vibeui-sitemap.xml
          grep -q "https://vibeui.club/components" /tmp/vibeui-sitemap.xml

      # vibeui.club — отдельный инстанс на латвийском VPS (не РФ: NOWPayments
      # доступен, латенси для англоязычных ниже). Тот же собранный релиз, свой
      # сервер/БД/env. Ключ тот же (DEPLOY_SSH_KEY добавлен и на Латвию).
      # Шаг идёт после релиза .ru — если Латвия недоступна, прод .ru уже цел.
      - name: Залить .club на латвийский VPS
        run: |
          ssh-keyscan -H "$CLUB_HOST" >> ~/.ssh/known_hosts
          REL="/srv/vibeui-club-releases/$(date -u +%Y%m%d-%H%M%S)"
          PREV=$(ssh "root@$CLUB_HOST" 'ls -1dt /srv/vibeui-club-releases/* 2>/dev/null | head -1')
          ssh "root@$CLUB_HOST" "mkdir -p '$REL'"
          rsync -az --checksum --delete --timeout=600 --info=stats2 \
            ${PREV:+--link-dest="$PREV"} \
            release/ "root@$CLUB_HOST:$REL/"
          ssh "root@$CLUB_HOST" "REL='$REL' bash -s" < scripts/deploy-remote-club.sh
        env:
          CLUB_HOST: 216.173.70.241

      - name: Проверить живой .club
        run: |
          fetch() {
            curl -sS --http1.1 --retry 2 --retry-delay 2 -o "$1" -w '%{http_code}' "$2" || true
          }
          code=$(fetch /tmp/club-start.html https://vibeui.club/start)
          echo "start $code"
          test "$code" = "200"
          grep -q 'id="paste"' /tmp/club-start.html
          code=$(fetch /tmp/club-bakery.html https://vibeui.club/scenarios/bakery/demo)
          echo "bakery $code"
          test "$code" = "200"
          grep -q 'Order for the morning' /tmp/club-bakery.html
          code=$(fetch /tmp/club-scenarios.html https://vibeui.club/scenarios)
          echo "scenarios $code"
          test "$code" = "200"
          grep -q '/scenarios/bakery/demo' /tmp/club-scenarios.html
          code=$(fetch /tmp/club-en.html https://vibeui.club/en/start)
          echo "en $code"
          test "$code" = "404"
          code=$(fetch /tmp/club-robots.txt https://vibeui.club/robots.txt)
          echo "robots $code"
          test "$code" = "200"
          grep -q "Sitemap: https://vibeui.club/sitemap.xml" /tmp/club-robots.txt
          code=$(fetch /tmp/club-sitemap.xml https://vibeui.club/sitemap.xml)
          echo "sitemap $code"
          test "$code" = "200"
          grep -q "<loc>https://vibeui.club/components</loc>" /tmp/club-sitemap.xml
