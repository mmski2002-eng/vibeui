name: deploy

# Сборка уехала с VPS в runner: на сервере одно ядро, 1 ГБ памяти и занятый
# своп, там next build занимал десятки минут. Runner собирает Linux-релиз,
# сервер только распаковывает его и переключает симлинк.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 185.104.251.106
  DEPLOY_USER: root
  REGISTRY_BASE_URL: https://vibeui.ru/r
  NEXT_PUBLIC_SITE_URL: https://vibeui.ru
  # Номера счётчиков и токены подтверждения прав лежат в коде: они публичны,
  # и переменные репозитория здесь только прятали бы настройку от следующего
  # разработчика. Пустая переменная перекрыла бы значение из кода — не задавать.
  # Каталог дорос до ~1770 items: проверка типов в `next build` (и отдельный
  # typecheck) упирается в дефолтный ~2 ГБ heap Node 20 и падает с OOM.
  # Runner ubuntu-latest несёт 16 ГБ — поднимаем потолок кучи.
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Та же мажорная версия, что и на сервере: standalone не несёт свой node.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Секрет нужен только чтобы better-auth не ругался при пререндере:
      # на сервере свой из .env, в бандл значение не попадает.
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-prerender-only-not-a-real-secret-0000' }}

      # Только после сборки: LayoutProps и прочие типы маршрутов Next
      # генерирует в .next/types, в чистом checkout их ещё нет.
      - run: npm run typecheck

      # Standalone не копирует статику сам.
      - name: Собрать релиз
        run: |
          mkdir -p release
          cp -a .next/standalone/. release/
          mkdir -p release/.next
          cp -a .next/static release/.next/static
          cp -a public release/public
          # Миграции применяет сервер: базы у runner-а нет, она слушает
          # только localhost.
          mkdir -p release/scripts
          cp -a drizzle release/drizzle
          cp scripts/migrate.sh release/scripts/migrate.sh
          tar -czf release.tar.gz -C release .

      - name: Ключ и known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Залить и переключить релиз
        run: |
          scp release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/vibeui-release.tar.gz"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < scripts/deploy-remote.sh

      - name: Проверить живой сайт
        run: |
          curl -fsS -o /dev/null -w 'components %{http_code}\n' https://vibeui.ru/components
          # Страница item'а публичная (её индексирует Google) и рендерится, но
          # код и команда установки закрыты: отдаются только по подписанной
          # ссылке после входа. Поэтому здесь проверяем сам рендер по slug, а
          # закрытость — маршрутом /c/<name>, который анониму отвечает 401.
          curl -fsS https://vibeui.ru/components/button-001 | grep -q "button-001"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://vibeui.ru/c/button-001)" = "401"
          curl -fsS https://vibeui.ru/robots.txt | grep -q "Sitemap: https://vibeui.ru/sitemap.xml"
          curl -fsS https://vibeui.ru/sitemap.xml | grep -q "<loc>https://vibeui.ru/components</loc>"
